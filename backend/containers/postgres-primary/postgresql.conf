# ---------------------------------------------------------------------------- #
# Postgres primary, development settings.
#
# Only what this project needs. Everything else stays at the server default, so
# a reviewer can see the whole decision surface on one screen.
# ---------------------------------------------------------------------------- #

listen_addresses = '*'
port = 5432
max_connections = 100

# Replication. wal_level replica is the minimum that lets a standby stream, and
# two senders leaves room for a pg_basebackup while the standby is connected.
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
wal_keep_size = '128MB'
hot_standby = on

# Async commit to the standby is the decision recorded in ADR.md: with a single
# standby, synchronous_standby_names would stall every write on the primary the
# moment the standby goes down.
synchronous_commit = on
synchronous_standby_names = ''

# Lock waits. A confirm transaction holds a row lock on trial_classes, so a
# stuck lock has to surface as an error rather than as a hung request.
lock_timeout = '5s'
statement_timeout = '15s'
idle_in_transaction_session_timeout = '30s'

# Logging loud enough to explain a failed booking during a demonstration.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '
log_lock_waits = on
log_checkpoints = on

shared_buffers = '128MB'
