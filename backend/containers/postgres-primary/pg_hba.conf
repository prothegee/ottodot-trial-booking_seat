# ---------------------------------------------------------------------------- #
# Postgres primary access rules, development only.
#
# The container network is the only network that reaches this server, and the
# compose file publishes 5432 on localhost only. Nothing here is a production
# posture, and how-to.md says so.
# ---------------------------------------------------------------------------- #

# type  database        user            address         method

local   all             all                             trust
host    all             all             127.0.0.1/32    scram-sha-256
host    all             all             ::1/128         scram-sha-256

# Application and replication traffic arrives from the compose network.
host    all             all             10.0.0.0/8      scram-sha-256
host    all             all             172.16.0.0/12   scram-sha-256
host    all             all             192.168.0.0/16  scram-sha-256

host    replication     all             10.0.0.0/8      scram-sha-256
host    replication     all             172.16.0.0/12   scram-sha-256
host    replication     all             192.168.0.0/16  scram-sha-256
