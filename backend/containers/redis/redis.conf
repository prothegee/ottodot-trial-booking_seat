# ---------------------------------------------------------------------------- #
# Redis, development settings.
#
# Redis is a cache and a rate limit here, never a source of truth. Persistence
# is switched off deliberately: if a restart could carry seat state forward,
# somebody would eventually rely on it, and a lost write would then mean an
# overbooked class. Losing everything on restart keeps that honest.
# ---------------------------------------------------------------------------- #

bind 0.0.0.0
port 6379

# Protected mode is off, and that reads worse than it is, so here is the whole
# reason. With it on and no password set, Redis answers DENIED to every client
# that is not on the loopback interface, which in a container means every client
# there is: the api and the worker each live in their own network namespace. The
# stack cannot start with it on.
#
# What is actually holding here is two layers below this file. The port is
# published as 127.0.0.1:6379, so nothing off this machine can reach it, and the
# container network is private to this compose file. Turning this on and adding
# a password would move the secret into the compose file and change nothing
# about who can connect.
#
# A deployment that puts Redis anywhere but a private network sets
# REDIS_PASSWORD and turns this back on. The api already reads that variable and
# holds it as a secret.
protected-mode no

# No snapshot, no append only file. Nothing here survives a restart.
save ""
appendonly no

# Cache behaviour. Once the ceiling is reached the least recently used key goes,
# which is the correct outcome for advisory data.
maxmemory 128mb
maxmemory-policy allkeys-lru

# A rate limit bucket and a denylist entry both carry their own expiry, so the
# active cycle stays small.
maxmemory-samples 5

timeout 0
tcp-keepalive 300

loglevel notice
logfile ""

databases 1
