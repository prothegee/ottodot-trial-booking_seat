# ---------------------------------------------------------------------------- #
# Redis, development settings.
#
# Redis is a cache and a rate limit here, never a source of truth. Persistence
# is switched off deliberately: if a restart could carry seat state forward,
# somebody would eventually rely on it, and a lost write would then mean an
# overbooked class. Losing everything on restart keeps that honest.
# ---------------------------------------------------------------------------- #

bind 0.0.0.0
port 6379
protected-mode yes

# No snapshot, no append only file. Nothing here survives a restart.
save ""
appendonly no

# Cache behaviour. Once the ceiling is reached the least recently used key goes,
# which is the correct outcome for advisory data.
maxmemory 128mb
maxmemory-policy allkeys-lru

# A rate limit bucket and a denylist entry both carry their own expiry, so the
# active cycle stays small.
maxmemory-samples 5

timeout 0
tcp-keepalive 300

loglevel notice
logfile ""

databases 1
