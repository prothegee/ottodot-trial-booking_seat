# ---------------------------------------------------------------------------- #
# What Prometheus scrapes, and how often.
#
# Four layers, across six jobs:
#   api 9000        the process, and what the service counts about itself
#   worker 9002     the process, and what the queue holds
#   node_exporter   the host: cpu, memory, drive, and inodes
#   cadvisor        each container: cpu, memory, drive, and restarts
#
# Five seconds rather than the usual fifteen, because this stack is demonstrated
# live and a counter nobody waits for is a counter nobody sees.
#
# The api and the worker are scraped twice each, at the container and at this
# machine, because backend/scripts/debug.sh runs one of them from source with its
# container stopped. Only one of each pair answers at a time.
#
# Container targets are named by compose service, so this file does not care what
# the host publishes. The source targets use host.containers.internal, which is a
# container's name for the machine it runs on.
# ---------------------------------------------------------------------------- #

global:
    scrape_interval: 5s
    scrape_timeout: 4s
    evaluation_interval: 5s

    external_labels:
        stack: ottodot-backend

rule_files:
    - /etc/prometheus/rules.yml

scrape_configs:
    - job_name: api
      metrics_path: /metrics
      static_configs:
          - targets: ["api:9000"]
            labels:
                component: api

    # The same api, from source on this machine. Both cannot be up at once, since
    # debug.sh refuses to start while the container holds 9000.
    #
    # The component label matches the container target on purpose: the NotReady
    # rule reads it, so a process that moved here still counts as answering. Under
    # Docker on Linux the name does not resolve and this target stays down.
    - job_name: api-source
      metrics_path: /metrics
      static_configs:
          - targets: ["host.containers.internal:9000"]
            labels:
                component: api

    - job_name: worker
      metrics_path: /metrics
      static_configs:
          - targets: ["worker:9002"]
            labels:
                component: worker

    # The worker from source, on the same terms as api-source above.
    - job_name: worker-source
      metrics_path: /metrics
      static_configs:
          - targets: ["host.containers.internal:9002"]
            labels:
                component: worker

    - job_name: node
      static_configs:
          - targets: ["node-exporter:9100"]
            labels:
                component: host

    # cAdvisor is the one target allowed to be absent. It is written against
    # Docker and needs a socket mounted where it expects one under rootless
    # Podman. Without it the panels degrade from per container to host wide.
    # how-to.md carries the command.
    - job_name: cadvisor
      static_configs:
          - targets: ["cadvisor:8080"]
            labels:
                component: containers

    # Prometheus scrapes itself, so "is monitoring up" is answerable from
    # monitoring rather than from somebody noticing a blank dashboard.
    - job_name: prometheus
      static_configs:
          - targets: ["localhost:9090"]
            labels:
                component: monitoring
