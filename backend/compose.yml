# ---------------------------------------------------------------------------- #
# The backend stack.
#
# This file names only what the backend owns: its databases, its cache, its own
# processes, and the monitoring that scrapes them. Nothing here reaches into
# another stack, and no path in it leaves this directory. That is what lets this
# stack be lifted out and deployed on its own.
#
# Brought up on its own with:
#   docker compose --file backend/compose.yml up --detach
#
# On a machine with podman-docker installed, the docker command is podman
# answering to the docker name, and this file runs the same way through it.
#
# Or together with the other stack through scripts/stack_up.sh, which is the
# only place allowed to act across both.
#
# State lives in containers/<service>/.data, so a volume belongs to the one
# container that writes it and removing one cannot take another's with it. The
# dot is required: this tree is inside the Go module, and go build ./... walks
# every directory without one.
#
# Each container mounts the parent of its data directory and creates the real one
# inside as its own user, which is what keeps this file working under both
# rootful Docker and rootless Podman. Postgres 18 expects that shape already, so
# PGDATA is left at the image default.
#
# Passwords here are development defaults, read from the environment first.
#
# config.json is deliberately not mounted: it names addresses on this machine,
# and a container reaches postgres and redis by service name. So containers are
# configured here and config.json configures a process run from source. The
# settings that must match, the signing key, the origin list, the worker count,
# and BUILD_VERSION, are named in both. build_identity_test.go fails when
# BUILD_VERSION drifts from the template.
# ---------------------------------------------------------------------------- #

name: ottodot-backend

services:
  postgres-primary:
    image: docker.io/library/postgres:18-alpine
    container_name: ottodot-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ottodot}
      POSTGRES_USER: ${POSTGRES_USER:-ottodot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ottodot_development}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-ottodot_replication}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-ottodot_replication_development}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICATION_SLOT:-ottodot_replica}
      OTTODOT_CONFIG_DIR: /etc/ottodot/postgresql
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    user: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./containers/postgres-primary/.data:/var/lib/postgresql
      - ./containers/postgres-primary/postgresql.conf:/etc/ottodot/postgresql/postgresql.conf:ro
      - ./containers/postgres-primary/pg_hba.conf:/etc/ottodot/postgresql/pg_hba.conf:ro
      - ./containers/postgres-primary/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $${POSTGRES_USER} --dbname $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ottodot-backend

  postgres-replica:
    image: docker.io/library/postgres:18-alpine
    container_name: ottodot-postgres-replica
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: "5432"
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-ottodot_replication}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-ottodot_replication_development}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICATION_SLOT:-ottodot_replica}
    user: postgres
    entrypoint: ["/usr/local/bin/init-replica.sh"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./containers/postgres-replica/.data:/var/lib/postgresql
      - ./containers/postgres-replica/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - ottodot-backend

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: ottodot-redis
    restart: unless-stopped
    command: ["redis-server", "/etc/ottodot/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./containers/redis/.data:/data
      - ./containers/redis/redis.conf:/etc/ottodot/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ottodot-backend

  api:
    build:
      context: .
      dockerfile: containers/Containerfile.api
      args:
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: ottodot-api:${BUILD_VERSION:-0.1.0}
    container_name: ottodot-api
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: "9000"
      # Two addresses, not one with a flag. Deciding reads go to the primary and
      # advisory ones to the replica, and a single value would make that choice
      # impossible to express.
      DATABASE_PRIMARY_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-primary:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      DATABASE_REPLICA_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-replica:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      REDIS_ADDRESS: redis:6379
      # The frontend stack serves on 9001. Both spellings of the loopback
      # address are listed because a browser treats them as different origins,
      # and the origin check compares against exactly these values.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:9001,http://localhost:9001}
      # A throwaway in development. Configuration refuses to start outside
      # development without a real one of at least 32 characters.
      JWT_SECRET: ${JWT_SECRET:-development-only-signing-key-not-for-any-real-environment}
      # False only here. Configuration refuses to start with it false anywhere
      # else, because the token cookies would travel in clear text.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Off unless the shell that started this stack asked for it, which is what
      # scripts/smoke_failure.sh needs and nothing else does. Configuration
      # refuses to start the process with it true outside development, so the
      # dangerous direction is a startup failure rather than a running service.
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-false}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      BUILD_COMMIT: ${BUILD_COMMIT:-}
    # The process binds every interface inside its own container, and this line
    # is where the loopback rule is enforced: the port is reachable from this
    # machine and from nowhere else.
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - ottodot-backend

  worker:
    build:
      context: .
      dockerfile: containers/Containerfile.worker
      args:
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    image: ottodot-worker:${BUILD_VERSION:-0.1.0}
    container_name: ottodot-worker
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Both pools are opened at startup, so both addresses are named even
      # though every decision a worker makes reads the primary.
      DATABASE_PRIMARY_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-primary:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      DATABASE_REPLICA_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-replica:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      REDIS_ADDRESS: redis:6379
      WORKER_METRICS_PORT: "9002"
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      # How many jobs this process works on at once. Zero means one per
      # processor the container is allowed to use.
      WORKER_COUNT: ${WORKER_COUNT:-0}
    # The process binds every interface inside its own container, and this line
    # is where the loopback rule is enforced: the port is reachable from this
    # machine and from nowhere else.
    ports:
      - "127.0.0.1:9002:9002"
    networks:
      - ottodot-backend

  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    container_name: ottodot-prometheus
    restart: unless-stopped
    depends_on:
      - api
      - worker
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Short, because this stack is demonstrated for an afternoon rather than
      # run for a quarter. A longer window would only fill a bind mount.
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9003:9090"
    volumes:
      - ./containers/prometheus/.data:/prometheus
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./containers/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ottodot-backend

  grafana:
    image: docker.io/grafana/grafana:11.5.1
    container_name: ottodot-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Every page asks for a sign in. The port is loopback only as well, so the
      # password is the second lock rather than the only one.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:9004:3000"
    volumes:
      - ./containers/grafana/.data:/var/lib/grafana
      # The dashboards are files rather than rows in Grafana's own database, so
      # a panel change is a diff a reviewer can read.
      - ./containers/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./containers/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ottodot-backend

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: ottodot-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # Everything this project cares about is on a real filesystem. Without
      # this the drive panels fill with dozens of container overlay mounts and
      # the one that matters is impossible to find.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/containers|var/lib/docker)($$|/)
    pid: host
    ports:
      - "127.0.0.1:9005:9100"
    volumes:
      # Read only, and the host root at a path of its own. This container reads
      # the machine and writes nothing anywhere.
      - /:/host:ro,rslave
    networks:
      - ottodot-backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: ottodot-cadvisor
    restart: unless-stopped
    # The one service allowed to fail. It is written against Docker and reads a
    # container runtime socket, so on a rootless machine it needs podman.socket
    # running. scripts/lib/stack.sh finds that socket, backend/how-to.md carries
    # the command that starts it. When it will not run, layers one and two still
    # cover cpu, memory, and drive, and the dashboard degrades from per container
    # to host wide.
    privileged: true
    ports:
      - "127.0.0.1:9006:8080"
    # The host /var/run is not mounted whole. Doing that leaves the runtime no
    # writable /run inside the container and it refuses to start. Only the one
    # socket cAdvisor actually reads is handed in.
    #
    # At two paths, because cAdvisor looks for each runtime at a fixed one.
    # Without the podman path a rootless container has no name for it to label a
    # series with, and the panels select on that name.
    #
    # /sys/fs/cgroup is named on its own even though /sys is already mounted.
    # Both runtimes give a container its own cgroup namespace, and the mount for
    # it lands on top of /sys, so what the container reads there is one cgroup,
    # its own. Naming the host path puts the whole tree back, and without it
    # every per container panel is empty.
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${CONTAINER_STORAGE_DIR:-/var/lib/containers}:/var/lib/docker:ro
      - ${CONTAINER_SOCKET:-/run/podman/podman.sock}:/var/run/docker.sock:ro
      - ${CONTAINER_SOCKET:-/run/podman/podman.sock}:/var/run/podman/podman.sock:ro
    networks:
      - ottodot-backend

networks:
  ottodot-backend:
    name: ottodot-backend
