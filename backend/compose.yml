# ---------------------------------------------------------------------------- #
# The backend stack.
#
# This file names only what the backend owns: its databases, its cache, its own
# processes, and the monitoring that scrapes them. Nothing here reaches into
# another stack, and no path in it leaves this directory. That is what lets this
# stack be lifted out and deployed on its own.
#
# Brought up on its own with:
#   podman compose --file backend/compose.yml up --detach
#
# Or together with the other stack through scripts/stack_up.sh, which is the
# only place allowed to act across both.
#
# State lives in bind mounts under backend/.data/, one directory per container,
# so a wipe is one visible path and a named volume never hides anything.
#
# Every container mounts the parent of its data directory rather than the data
# directory itself, and creates the real one inside as its own user. That is
# what keeps this file working under rootful Docker and rootless Podman, where a
# container user maps to a different host user in each case. Postgres 18 already
# expects that shape: its declared volume is /var/lib/postgresql while the real
# data directory is a version stamped path inside it, so PGDATA is left at the
# image default here rather than overridden.
#
# Passwords here are development defaults. Every one of them reads from the
# environment first, and how-to.md says plainly that this posture is local only.
# ---------------------------------------------------------------------------- #

name: ottodot-backend

services:
  postgres-primary:
    image: docker.io/library/postgres:18-alpine
    container_name: ottodot-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ottodot}
      POSTGRES_USER: ${POSTGRES_USER:-ottodot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ottodot_development}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-ottodot_replication}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-ottodot_replication_development}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICATION_SLOT:-ottodot_replica}
      OTTODOT_CONFIG_DIR: /etc/ottodot/postgresql
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    user: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.data/postgres-primary:/var/lib/postgresql
      - ./containers/postgresql/primary/postgresql.conf:/etc/ottodot/postgresql/postgresql.conf:ro
      - ./containers/postgresql/primary/pg_hba.conf:/etc/ottodot/postgresql/pg_hba.conf:ro
      - ./containers/postgresql/primary/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $${POSTGRES_USER} --dbname $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ottodot-backend

  postgres-replica:
    image: docker.io/library/postgres:18-alpine
    container_name: ottodot-postgres-replica
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: "5432"
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-ottodot_replication}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-ottodot_replication_development}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICATION_SLOT:-ottodot_replica}
    user: postgres
    entrypoint: ["/usr/local/bin/init-replica.sh"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.data/postgres-replica:/var/lib/postgresql
      - ./containers/postgresql/replica/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - ottodot-backend

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: ottodot-redis
    restart: unless-stopped
    command: ["redis-server", "/etc/ottodot/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./.data/redis:/data
      - ./containers/redis/redis.conf:/etc/ottodot/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ottodot-backend

  api:
    build:
      context: .
      dockerfile: containers/Containerfile.api
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    image: ottodot-api:${BUILD_VERSION:-dev}
    container_name: ottodot-api
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: "9000"
      # Two addresses, not one with a flag. Deciding reads go to the primary and
      # advisory ones to the replica, and a single value would make that choice
      # impossible to express.
      DATABASE_PRIMARY_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-primary:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      DATABASE_REPLICA_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-replica:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      REDIS_ADDRESS: redis:6379
      # The frontend stack serves on 9001. It is named here because the origin
      # check on every write compares against exactly this value.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:9001}
      # A throwaway in development. Configuration refuses to start outside
      # development without a real one of at least 32 characters.
      JWT_SECRET: ${JWT_SECRET:-development-only-signing-key-not-for-any-real-environment}
      # False only here. Configuration refuses to start with it false anywhere
      # else, because the token cookies would travel in clear text.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BUILD_VERSION: ${BUILD_VERSION:-dev}
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    # The process binds every interface inside its own container, and this line
    # is where the loopback rule is enforced: the port is reachable from this
    # machine and from nowhere else.
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - ottodot-backend

  worker:
    build:
      context: .
      dockerfile: containers/Containerfile.worker
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: ottodot-worker:${BUILD_VERSION:-dev}
    container_name: ottodot-worker
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Both pools are opened at startup, so both addresses are named even
      # though every decision a worker makes reads the primary.
      DATABASE_PRIMARY_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-primary:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      DATABASE_REPLICA_URL: postgres://${POSTGRES_USER:-ottodot}:${POSTGRES_PASSWORD:-ottodot_development}@postgres-replica:5432/${POSTGRES_DB:-ottodot}?sslmode=disable
      REDIS_ADDRESS: redis:6379
      WORKER_METRICS_PORT: "9002"
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
    # The process binds every interface inside its own container, and this line
    # is where the loopback rule is enforced: the port is reachable from this
    # machine and from nowhere else.
    ports:
      - "127.0.0.1:9002:9002"
    networks:
      - ottodot-backend

  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    container_name: ottodot-prometheus
    restart: unless-stopped
    depends_on:
      - api
      - worker
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Short, because this stack is demonstrated for an afternoon rather than
      # run for a quarter. A longer window would only fill a bind mount.
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9003:9090"
    volumes:
      - ./.data/prometheus:/prometheus
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./containers/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ottodot-backend

  grafana:
    image: docker.io/grafana/grafana:11.5.1
    container_name: ottodot-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # A local password on a loopback published port. Anonymous access is on so
      # a reviewer sees the dashboards without a sign in, and it is read only.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ottodot_development}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:9004:3000"
    volumes:
      - ./.data/grafana:/var/lib/grafana
      # The dashboards are files rather than rows in Grafana's own database, so
      # a panel change is a diff a reviewer can read.
      - ./containers/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./containers/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ottodot-backend

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: ottodot-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # Everything this project cares about is on a real filesystem. Without
      # this the drive panels fill with dozens of container overlay mounts and
      # the one that matters is impossible to find.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/containers|var/lib/docker)($$|/)
    pid: host
    ports:
      - "127.0.0.1:9005:9100"
    volumes:
      # Read only, and the host root at a path of its own. This container reads
      # the machine and writes nothing anywhere.
      - /:/host:ro,rslave
    networks:
      - ottodot-backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: ottodot-cadvisor
    restart: unless-stopped
    # The one service allowed to fail. It reads a container runtime socket and
    # is written against Docker, so under rootless Podman it needs
    # `podman system service` running with its socket where this expects one.
    # how-to.md carries the exact command. When it will not start, layers one
    # and two still cover cpu, memory, and drive, and the dashboard degrades
    # from per container to host wide.
    privileged: true
    ports:
      - "127.0.0.1:9006:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${CONTAINER_STORAGE_DIR:-/var/lib/containers}:/var/lib/docker:ro
      - ${CONTAINER_SOCKET:-/run/podman/podman.sock}:/var/run/docker.sock:ro
    networks:
      - ottodot-backend

networks:
  ottodot-backend:
    name: ottodot-backend
