# ---------------------------------------------------------------------------- #
# The frontend stack.
#
# One service: the static bundle behind nginx on 9001. No path in this file
# leaves this directory, so the stack can be lifted out and deployed on its own.
#
# Brought up on its own with:
#   docker compose --file frontend/compose.yml up --detach
#
# On a machine with podman-docker installed, the docker command is podman
# answering to the docker name, and this file runs the same way through it.
#
# Or together with the other stack through scripts/stack_up.sh, which is the
# only place allowed to act across both.
#
# There is no network link to the backend, and that is deliberate. The browser
# calls the api on 9000 directly and sends its real origin, which is what the
# api checks on every mutation. Proxying through this container would hide that
# origin and quietly disable the check.
#
# The api address and the build identity are build arguments, not runtime
# settings, because the bundle is static and the values are compiled into it.
#
# This stack holds no state, so no service here has a data directory.
# ---------------------------------------------------------------------------- #

name: ottodot-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: containers/Containerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:9000}
        BUILD_VERSION: ${BUILD_VERSION:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    image: ottodot-frontend
    container_name: ottodot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9001/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ottodot-frontend

networks:
  ottodot-frontend:
    name: ottodot-frontend
