# ---------------------------------------------------------------------------- #
# nginx serves the static bundle on 9001.
#
# try_files is what makes client routing work. A parent who reloads on
# /book/some-id must get the same document as a parent who arrived there by
# clicking, because no server here knows what a class id is.
#
# There is no reverse proxy to the api. The client calls 9000 directly and sends
# its real origin, which is what the api checks on every mutation. Proxying
# would hide that origin and quietly disable the check.
#
# This file is the whole server block. It is copied over the default one in
# /etc/nginx/conf.d, so nothing from the image's own example is left serving.
# ---------------------------------------------------------------------------- #

server {
    listen 9001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The version stays out of the response header. The name itself needs a
    # module the official image does not carry, so it remains.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
